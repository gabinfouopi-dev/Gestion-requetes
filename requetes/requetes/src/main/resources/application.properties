# Nom de l'application
spring.application.name=requetes

# Configuration MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/requetesdb?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Encodage
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Port
server.port=8080

# Jackson - eviter erreur sur proxies/lazy
spring.jackson.serialization.fail-on-empty-beans=false
